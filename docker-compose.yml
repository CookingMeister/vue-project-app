# Two profiles, so neither starts by accident:
#   docker compose --profile dev up          # Vite dev server, hot reload
#   docker compose --profile prod up -d --build   # nginx serving the built site
services:
  dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0

  web:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Publish a port when nginx is reached directly. Remove this when Traefik
    # fronts it - the container only needs to be on Traefik's network.
    ports:
      - '8080:80'
    # Traefik picks these up when it is running with the Docker provider.
    # `traefik.enable` stays false until you opt in, so this file is inert
    # without Traefik.
    labels:
      - 'traefik.enable=false'
      - 'traefik.http.routers.portfolio.rule=Host(`fullstackchef.dev`)'
      - 'traefik.http.routers.portfolio.entrypoints=websecure'
      - 'traefik.http.routers.portfolio.tls.certresolver=letsencrypt'
      - 'traefik.http.services.portfolio.loadbalancer.server.port=80'
    # networks:
    #   - traefik

