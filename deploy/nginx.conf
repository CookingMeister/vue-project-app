# Static hosting for the prerendered site.
#
# In the container this is copied to /etc/nginx/conf.d/default.conf. On a bare
# Ubuntu host, drop it in /etc/nginx/sites-available/, symlink it into
# sites-enabled/, and change `root` to wherever you copied dist/.
#
# TLS is not configured here on purpose: terminate it upstream at Cloudflare,
# Traefik, or a certbot-managed server block, and let this serve plain HTTP.

# Fingerprinted assets can be cached forever; HTML must revalidate so a deploy
# is picked up immediately. Declaring it as a map keeps a single `add_header` at
# server level - nginx drops inherited headers in any location that adds its own.
map $uri $cache_control {
    default                                     "no-cache";
    ~^/assets/                                  "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|svg|webp|avif|ico)$    "public, max-age=2592000";
    ~*\.(?:woff2?|ttf|otf)$                     "public, max-age=2592000";
    ~*\.(?:pdf|docx)$                           "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One canonical URL shape: /resume, never /resume/. Matches the canonical
    # tags the build writes into each page.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        # The prerendered file, then its directory index. Every real route has
        # one, so anything left over is a genuine 404 rather than an SPA path.
        try_files $uri $uri/index.html =404;
    }

    # Prerendered by scripts/prerender.mjs, served with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header Cache-Control $cache_control always;

    # The build emits no inline scripts or styles and loads nothing
    # cross-origin, so this needs no 'unsafe-inline'. `data:` is for the SVGs
    # Bootstrap inlines into its CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    # Enable once HTTPS is confirmed working end to end - it is hard to undo,
    # because browsers honour the max-age even after the header is removed.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Already compressed; gzipping them again only costs CPU.
    gzip_disable "msie6";

    location = /img/fullstackchef-favicon.png {
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
